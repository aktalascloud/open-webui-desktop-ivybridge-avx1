appId: com.openwebui.desktop
productName: Open WebUI
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.{pdb,map}'
extraResources:
  - from: .avx1/toolchains.json
    to: avx1-toolchains.json
  - from: .avx1/fork_backend.py
    to: fork_backend.py
  - from: CHANGELOG.md
    to: CHANGELOG.md
  - from: LICENSE
    to: licenses/LICENSE-AGPL-3.0
  - from: src/renderer/src/lib/assets/fonts/Vazirmatn-LICENSE.txt
    to: licenses/Vazirmatn-LICENSE.txt
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
electronFuses:
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: open-webui
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  artifactName: ${name}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${name}-${arch}-mac.${ext}
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  background: build/dmg-background.png
  artifactName: ${name}-${arch}.${ext}
  title: ${productName}
  contents:
    - x: 225
      y: 250
      type: file
    - x: 400
      y: 240
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
    - flatpak
  maintainer: openwebui.com
  category: Utility
deb:
  artifactName: ${name}_${arch}.${ext}
snap:
  # Keep native dependencies compatible with the Linux x64 build runner.
  base: core22
  artifactName: ${name}_${arch}.${ext}
appImage:
  artifactName: ${name}_${arch}.${ext}
flatpak:
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '25.08'
  runtime: org.freedesktop.Platform
  runtimeVersion: '25.08'
  sdk: org.freedesktop.Sdk
  artifactName: ${name}.flatpak
  finishArgs:
    - --share=ipc
    - --socket=x11
    - --socket=wayland
    - --socket=pulseaudio
    - --share=network
    - --device=dri
    - --filesystem=home
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.freedesktop.portal.Desktop
npmRebuild: true
publish:
  provider: github
  owner: aktalascloud
  repo: open-webui-desktop-ivybridge-avx1
